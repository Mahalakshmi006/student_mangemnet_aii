<!-- AI Feedback Section -->
<!--col-md-7 = Bootstrap 12-column system-la 7 columns width-->
<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-7">

            <div class="card">

                <div class="card-header bg-dark text-white text-center">
                    AI Student Performance Feedback
                </div>

                <div class="card-body">

                    <h5>Select Student</h5>

                      <select
                        class="form-control"
                        id="studentSelect"
                    >
                        
                        <option value="">Choose Student</option>

                        {% for student in students %}<!----start  loop- value within curlybracket -->
                        <option value="{{ student.Student_ID }}"> <!--option value na yto store avlue-->
                            {{ student.Name }}<!--athoda name-->
                        </option>
                        {% endfor %}<!----end loop-->
                      </select> 

                    <button
                          id="analyzeBtn"
                          class="btn btn-primary mt-3">
                          Analyze Student
                      </button>
                    <hr>

                    <h5>AI Comment:</h5>

                    <div class="alert alert-info" id="aiComment">
                        Feedback will appear here...
                    </div>


                </div>

            </div>

        </div>

    </div>

</div>
</div>

<!------------to fetch a dataa into sqwl to ai box---
Dropdown-la user select panna Student_ID edukkrom. studentId → 101
null na if then request a roue  @app.route("/analyze_student", methods=["POST"])
Data-va store / send / receive panna use panra oru simple format
json{
  "name": "Ravi",
  "mark": 85
}JavaScript ↔ Flask data exchange pana use panuthom 


------------------------------>
<script>
  
document.addEventListener("DOMContentLoaded", function () {

    document.getElementById("analyzeBtn").addEventListener("click", function () {

        let studentId = document.getElementById("studentSelect").value;

        if (studentId == "") {
            alert("Please select a student");
            return;
        }

        fetch("/analyze_student", {
            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                student_id: studentId
            })

        })

        .then(response => response.json())

        .then(data => {

            document.getElementById("aiComment").innerHTML =
            "<b>Name:</b> " + data.name + "<br>" +
            "<b>Subject:</b> " + data.subject + "<br>" +
            "<b>Mark:</b> " + data.mark + "<br>" +
            "<b>Attendance:</b> " + data.attendance;

        });

    });

});
</script>

<!----alret link-->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script>

{% with messages = get_flashed_messages(with_categories=true) %}

{% if messages %}

{% for category,message in messages %}

Swal.fire({

title:
{% if category == "success" %}
"Success!"
{% else %}
"Error!"
{% endif %},

text:"{{message}}",

icon:
{% if category == "success" %}
"success"
{% else %}
"error"
{% endif %},

confirmButtonText:"OK"

});

{% endfor %}

{% endif %}

{% endwith %}

</script>
<script>
document.addEventListener("DOMContentLoaded", function () {

    document.getElementById("analyzeBtn").addEventListener("click", function () {

        let studentId = document.getElementById("studentSelect").value;

        if (studentId === "") {
            alert("Please select a student");
            return;
        }

        fetch("/analyze_student", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                student_id: studentId
            })
        })

        .then(response => response.json())

        .then(data => {

            document.getElementById("aiComment").innerHTML =
                "<b>Name:</b> " + data.name + "<br>" +
                "<b>Subject:</b> " + data.subject + "<br>" +
                "<b>Mark:</b> " + data.mark + "<br>" +
                "<b>Attendance:</b> " + data.attendance +
                "<hr><b>AI Feedback:</b> Generating...";

            return fetch("/generate-ai-feedback", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    name: data.name,
                    subject: data.subject,
                    mark: data.mark,
                    attendance: data.attendance
                })
            });

        })

        .then(response => response.json())

        .then(data => {

            document.getElementById("aiComment").innerHTML +=
                "<hr><b>AI Feedback:</b><br>" + data.feedback;

        })

        .catch(error => {

            console.error(error);

            document.getElementById("aiComment").innerHTML =
                "<b>Error:</b> Something went wrong. Check terminal.";

        });

    });   // 🔴 Analyze button click closing

});       // 🔴 DOMContentLoaded closing
</script>
